# TEMP: lftp FTPS connection test only (FileZilla-equivalent settings)
# REMOVE hardcoded credentials after diagnosis — connection test, no uploads

name: Test FTP (lftp)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-ftp-lftp.yml'

concurrency:
  group: test-ftp-lftp
  cancel-in-progress: true

jobs:
  lftp-connect:
    name: lftp explicit FTPS login test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp --version

      - name: Test FTPS connection (no upload)
        id: lftp
        env:
          FTP_USER: githubdeploy@kyrithbuilds.com
          FTP_PASS: koinaijane@123
          FTP_HOST: ftp.kyrithbuilds.com
        run: |
          set -o pipefail
          OUT="$(mktemp)"
          ERR="$(mktemp)"

          echo "Host: ${FTP_HOST}"
          echo "User: ${FTP_USER}"
          echo "Mode: explicit FTPS (ssl-force + ssl-protect-data), verify-cert=no"
          echo ""

          set +e
          lftp -u "${FTP_USER}","${FTP_PASS}" -e "
          set ftp:ssl-force true;
          set ftp:ssl-protect-data true;
          set ssl:verify-certificate no;
          open ${FTP_HOST};
          pwd;
          ls;
          bye
          " >"$OUT" 2>"$ERR"
          CODE=$?
          set -e

          echo "=== lftp stdout ==="
          cat "$OUT"
          echo ""
          echo "=== lftp stderr ==="
          cat "$ERR"
          echo ""

          if [ "$CODE" -eq 0 ]; then
            echo "authenticated: true"
            echo "connection_result: success"
          else
            echo "authenticated: false"
            echo "connection_result: failure (exit ${CODE})"
            echo "lftp_failed=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "=== parsed ==="
          echo "current_directory:"
          grep -E '^ftp://|^/' "$OUT" || grep -i 'pwd' "$OUT" || head -1 "$OUT" || echo "(see lftp stdout above)"
          echo ""
          echo "directory_listing:"
          cat "$OUT"

          {
            echo "authenticated=true"
            echo "connection_result=success"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          echo "## lftp FTPS connection test" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Host:** \`ftp.kyrithbuilds.com\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Mode:** explicit FTPS (FileZilla-equivalent)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Upload:** none" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Result:** \`${{ steps.lftp.outputs.connection_result || 'failure' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Authenticated:** \`${{ steps.lftp.outputs.authenticated || 'false' }}\`" >> "$GITHUB_STEP_SUMMARY"
