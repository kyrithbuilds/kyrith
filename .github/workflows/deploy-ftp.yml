# Deploy KyrithBuilds to cPanel (public_html) via lftp + explicit FTPS.
#
# Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# Variable (optional): FTP_SITE_DIR — use "." when FTP login root is already public_html (default)
#
# Uploads: dist/ → public_html/   |   deploy-api/ → public_html/api/
# Never overwrites/deletes: api/config.local.php, .env, logs/, uploads/

name: Deploy FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_URL: ${{ vars.DEPLOY_URL || 'https://kyrithbuilds.com' }}
    steps:
      - name: Validate FTP secrets
        run: |
          if [ -z "$FTP_SERVER" ]; then echo "::error::Missing secret FTP_SERVER"; exit 1; fi
          if [ -z "$FTP_USERNAME" ]; then echo "::error::Missing secret FTP_USERNAME"; exit 1; fi
          if [ -z "$FTP_PASSWORD" ]; then echo "::error::Missing secret FTP_PASSWORD"; exit 1; fi
          echo "FTP secrets present."
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Prepare API deploy bundle (no secrets)
        run: |
          set -euo pipefail
          rm -rf deploy-api
          mkdir -p deploy-api
          cp backend/api/contact.php deploy-api/
          cp backend/api/.htaccess deploy-api/
          cp backend/api/config.local.example.php deploy-api/
          test -f deploy-api/contact.php
          test -f deploy-api/.htaccess
          test -f deploy-api/config.local.example.php

      - name: Resolve FTP paths
        id: paths
        run: |
          # Deploy user (githubdeploy@) chroots to public_html — do not cd into public_html again.
          SITE_DIR="${{ vars.FTP_SITE_DIR }}"
          SITE_DIR="${SITE_DIR:-.}"
          SITE_DIR="${SITE_DIR%/}"
          if [ -z "$SITE_DIR" ]; then SITE_DIR="."; fi
          if [ "$SITE_DIR" = "." ]; then
            API_DIR="api"
          else
            API_DIR="${SITE_DIR}/api"
          fi
          echo "site_dir=${SITE_DIR}" >> "$GITHUB_OUTPUT"
          echo "api_dir=${API_DIR}" >> "$GITHUB_OUTPUT"
          echo "FTP site target: ${SITE_DIR} (login root when '.')"
          echo "FTP API target: ${API_DIR}"

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Deploy via lftp (explicit FTPS)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SITE_DIR: ${{ steps.paths.outputs.site_dir }}
          API_DIR: ${{ steps.paths.outputs.api_dir }}
        run: |
          set -euo pipefail
          REPO_ROOT="$GITHUB_WORKSPACE"

          echo "Deploying frontend: dist/ → ${SITE_DIR}/"
          echo "Deploying API: deploy-api/ → ${API_DIR}/"
          echo "Mode: explicit FTPS, passive, verify-cert=no"

          lftp -e "
          set ftp:passive-mode true;
          set ftp:ssl-force true;
          set ftp:ssl-protect-data true;
          set ssl:verify-certificate no;
          open -u ${FTP_USERNAME},${FTP_PASSWORD} ftp://${FTP_SERVER};
          cd ${SITE_DIR};
          # Vite hashes change each build; remove stale bundles so index.html cannot reference old JS
          rm -rf assets;
          lcd ${REPO_ROOT}/dist;
          mirror -R --delete . . \
            --exclude api/ \
            --exclude-glob 'api/**' \
            --exclude-glob 'config.local.php' \
            --exclude-glob '.env' \
            --exclude-glob '.env.*' \
            --exclude-glob 'logs/**' \
            --exclude-glob 'uploads/**';
          cd ${API_DIR};
          lcd ${REPO_ROOT}/deploy-api;
          mirror -R . . \
            --exclude-glob 'config.local.php' \
            --exclude-glob '.env' \
            --exclude-glob '.env.*' \
            --exclude-glob 'logs/**' \
            --exclude-glob 'uploads/**' \
            --exclude-glob 'mail/**' \
            --exclude-glob '*.log';
          bye
          "

          echo "lftp deploy completed."

      - name: Post-deploy health checks
        id: health
        run: |
          set +e
          BASE="${DEPLOY_URL%/}"
          FAIL=0
          HOME_OK=0
          CONTACT_OK=0

          check_url() {
            local name="$1"
            local path="$2"
            local pattern="$3"
            local url="${BASE}${path}"
            local code
            code=$(curl -sS -o /tmp/deploy-body.txt -w "%{http_code}" --max-time 45 -L "$url")
            echo "--- ${name}: ${url} → HTTP ${code}"
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              echo "::warning::${name}: HTTP ${code}"
              FAIL=1
              return 1
            fi
            if [ -n "$pattern" ] && ! grep -q "$pattern" /tmp/deploy-body.txt; then
              echo "::warning::${name}: response missing expected content"
              FAIL=1
              return 1
            fi
            return 0
          }

          check_url home "/" "KyrithBuilds" && HOME_OK=1
          # SPA: /contact serves index.html (no "Contact" in static markup)
          check_url contact "/contact" "KyrithBuilds" && CONTACT_OK=1

          {
            echo "home_ok=${HOME_OK}"
            echo "contact_ok=${CONTACT_OK}"
            echo "checks_failed=${FAIL}"
          } >> "$GITHUB_OUTPUT"

          echo ""
          echo "=== Deployment status ==="
          echo "| Check | URL | Result |"
          echo "|-------|-----|--------|"
          echo "| home | ${BASE}/ | $([ "$HOME_OK" = 1 ] && echo pass || echo fail) |"
          echo "| contact | ${BASE}/contact | $([ "$CONTACT_OK" = 1 ] && echo pass || echo fail) |"

          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "::warning::Deploy upload completed but one or more live URL checks failed."
            exit 1
          fi
          echo ""
          echo "All post-deploy checks passed."

      - name: Deployment summary
        if: always()
        run: |
          echo "## Deploy summary (lftp)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tool:** lftp (explicit FTPS, passive)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Frontend:** \`dist/\` → \`${{ steps.paths.outputs.site_dir }}/\` (mirror --delete)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **API:** \`deploy-api/\` → \`${{ steps.paths.outputs.api_dir }}/\` (mirror, no delete)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Protected on server:** \`config.local.php\`, \`.env\`, \`logs/\`, \`uploads/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **home:** $([ '${{ steps.health.outputs.home_ok }}' = '1' ] && echo pass || echo fail)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **contact:** $([ '${{ steps.health.outputs.contact_ok }}' = '1' ] && echo pass || echo fail)" >> "$GITHUB_STEP_SUMMARY"
