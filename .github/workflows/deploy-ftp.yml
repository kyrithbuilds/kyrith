# FTP deploy. Uploads to ./public_html/ inside THIS user's home only (see cPanel Path column).
#
# Secrets (must match cPanel → FTP Accounts → Manual Settings exactly):
#   FTP_SERVER=ftp.kyrithbuilds.com
#   FTP_USERNAME=tirth@kyrithbuilds.com
#   FTP_PASSWORD=<that account's password>
#
# Optional Variable: USE_EXPLICIT_FTPS = true  (cPanel lists "FTP & explicit FTPS" on port 21)

name: Deploy FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_PROTOCOL: ${{ vars.USE_EXPLICIT_FTPS == 'true' && 'ftps' || 'ftp' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - name: Artifact — API
        uses: actions/upload-artifact@v4
        with:
          name: site-api
          path: backend/api/
          retention-days: 14

      - name: FTP — site → public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ env.FTP_PROTOCOL }}
          port: 21
          security: loose
          local-dir: ./dist/
          server-dir: ./public_html/

      - name: FTP — API → public_html/api
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ env.FTP_PROTOCOL }}
          port: 21
          security: loose
          local-dir: ./backend/api/
          server-dir: ./public_html/api/
