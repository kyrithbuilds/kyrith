# Single job: build then FTP (same shape as the first setup that uploaded successfully).
# Target: ./public_html/ relative to FTP home only — do not use ../ paths in server-dir.
#
# Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#
# If deploy fails after you set GitHub Variables for FTP_PROTOCOL/FTP_PORT, remove those
# variables so plain FTP on 21 is used (wrong FTPS settings can look like “random” failures).

name: Deploy FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - name: Artifact — API
        uses: actions/upload-artifact@v4
        with:
          name: site-api
          path: backend/api/
          retention-days: 14

      - name: FTP — site → public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          security: loose
          local-dir: ./dist/
          server-dir: ./public_html/

      - name: FTP — API → public_html/api
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          security: loose
          local-dir: ./backend/api/
          server-dir: ./public_html/api/
