# Deploy KyrithBuilds Admin to cPanel (public_html/admin.kyrithbuilds.com) via lftp.
#
# Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD (same as the marketing site)
# Variables (optional):
#   FTP_ADMIN_SITE_DIR — folder relative to FTP login root (default: admin.kyrithbuilds.com)
#   ADMIN_DEPLOY_URL   — live admin URL (default: https://admin.kyrithbuilds.com)
#
# Does not upload config.local.php — create that once on the server.

name: Deploy Admin FTP

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - '.github/workflows/deploy-admin-ftp.yml'
  workflow_dispatch:

concurrency:
  group: deploy-admin-ftp
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy admin panel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_URL: ${{ vars.ADMIN_DEPLOY_URL || 'https://admin.kyrithbuilds.com' }}
    steps:
      - name: Validate FTP secrets
        run: |
          if [ -z "$FTP_SERVER" ]; then echo "::error::Missing secret FTP_SERVER"; exit 1; fi
          if [ -z "$FTP_USERNAME" ]; then echo "::error::Missing secret FTP_USERNAME"; exit 1; fi
          if [ -z "$FTP_PASSWORD" ]; then echo "::error::Missing secret FTP_PASSWORD"; exit 1; fi
          echo "FTP secrets present."
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

      - uses: actions/checkout@v4

      - name: Verify deploy bundle
        run: |
          set -euo pipefail
          test -f admin/includes/db.php
          test -f admin/includes/entity-helpers.php
          test -f admin/includes/lookup-options.php
          test -f admin/schema-patch-lookups.sql
          test -f admin/config.local.example.php
          test -f admin/.htaccess
          test -f admin/clients.php
          test -f admin/api/clients-create.php
          test -f admin/assets/js/entity-crud.js
          echo "admin/ bundle looks good."

      - name: Resolve FTP path
        id: paths
        run: |
          SITE_DIR="${{ vars.FTP_ADMIN_SITE_DIR }}"
          SITE_DIR="${SITE_DIR:-admin.kyrithbuilds.com}"
          SITE_DIR="${SITE_DIR%/}"
          if [ -z "$SITE_DIR" ]; then SITE_DIR="admin.kyrithbuilds.com"; fi
          echo "site_dir=${SITE_DIR}" >> "$GITHUB_OUTPUT"
          echo "FTP target: ${SITE_DIR}/ (relative to FTP login root)"

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Deploy via lftp (explicit FTPS)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SITE_DIR: ${{ steps.paths.outputs.site_dir }}
        run: |
          set -euo pipefail
          REPO_ROOT="$GITHUB_WORKSPACE"

          echo "Deploying admin/ → ${SITE_DIR}/"
          echo "Mode: explicit FTPS, passive, verify-cert=no"

          lftp -e "
          set ftp:passive-mode true;
          set ftp:ssl-force true;
          set ftp:ssl-protect-data true;
          set ssl:verify-certificate no;
          open -u ${FTP_USERNAME},${FTP_PASSWORD} ftp://${FTP_SERVER};
          mkdir -p -f ${SITE_DIR};
          cd ${SITE_DIR};
          lcd ${REPO_ROOT}/admin;
          mirror -R . . \
            --exclude-glob 'config.local.php' \
            --exclude-glob '*.sql' \
            --exclude-glob '.env' \
            --exclude-glob '.env.*' \
            --exclude-glob 'logs/**' \
            --exclude-glob 'uploads/**' \
            --exclude-glob 'storage/sessions/sess_*';
          bye
          "

          echo "lftp deploy completed."

      - name: Post-deploy health check
        id: health
        run: |
          set +e
          BASE="${DEPLOY_URL%/}"
          HEALTH_OK=0

          CURL_OPTS=(
            -sS
            --max-time 45
            -L
            -A "Mozilla/5.0 (compatible; KyrithBuildsDeploy/1.0)"
            -H "Accept: text/html,application/xhtml+xml;q=0.9,*/*;q=0.8"
          )

          try_url() {
            local url="$1"
            local code
            code=$(curl "${CURL_OPTS[@]}" -o /tmp/admin-health-body.txt -w "%{http_code}" "$url")
            echo "--- ${url} → HTTP ${code}"
            if [ -f /tmp/admin-health-body.txt ]; then
              head -c 400 /tmp/admin-health-body.txt | tr '\n' ' '
              echo ""
            fi
            if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
              return 0
            fi
            return 1
          }

          if try_url "${BASE}/login" && grep -q "Sign in" /tmp/admin-health-body.txt; then
            HEALTH_OK=1
          elif try_url "${BASE}/login.php" && grep -q "Sign in" /tmp/admin-health-body.txt; then
            HEALTH_OK=1
          else
            echo "::warning::Admin URL failed. Files should be in public_html/admin.kyrithbuilds.com — check FTP_ADMIN_SITE_DIR."
          fi

          echo "health_ok=${HEALTH_OK}" >> "$GITHUB_OUTPUT"

          if [ "$HEALTH_OK" -ne 1 ]; then
            echo "::warning::Upload finished but login is not reachable at ${BASE}/login"
            exit 1
          fi
          echo "Health check passed."

      - name: Deployment summary
        if: always()
        run: |
          echo "## Admin deploy summary (lftp)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Target:** \`admin/\` → \`${{ steps.paths.outputs.site_dir }}/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL:** ${{ env.DEPLOY_URL }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **config.local.php:** not uploaded (create on server)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **health:** $([ '${{ steps.health.outputs.health_ok }}' = '1' ] && echo pass || echo fail)" >> "$GITHUB_STEP_SUMMARY"
